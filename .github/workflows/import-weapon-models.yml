name: Import 10 original 3D weapon GLBs
on:
  push:
    branches:
      - assets/weapon-glb-exports
permissions:
  contents: write
jobs:
  import-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download archived 3D viewmodels
        env:
          ASSET_URL: https://d2ol7oe51mr4n9.cloudfront.net/user_35mHqSgAEwuvB9MKmA8pVjdCZW3/7139e9e4-d9f8-4a48-9649-6142c4568270.zip
          EXPECTED_SHA256: eaef544ff80107a2ab10586780ed604b0c38418fb87c5b57c3e9e567eb5c4b46
        run: |
          mkdir -p assets/weapons
          curl --fail --location --retry 3 --max-time 70 "$ASSET_URL" --output /tmp/undead-siege-weapons.zip
          echo "$EXPECTED_SHA256  /tmp/undead-siege-weapons.zip" | sha256sum -c -
          unzip -o /tmp/undead-siege-weapons.zip -d assets/weapons
          python3 - <<'PY'
          from pathlib import Path
          import struct
          directory=Path('assets/weapons')
          models=sorted(directory.glob('*.glb'))
          assert len(models)==10, "Expected 10 3D GLB models"
          for model in models:
              magic,version,length=struct.unpack('<4sII',model.read_bytes()[:12])
              assert magic==b'glTF' and version==2 and length==model.stat().st_size,model
              print('Valid GLB:',model.name,model.stat().st_size)
          PY
      - name: Commit actual model files to integration branch
        run: |
          git add assets/weapons
          if git diff --cached --quiet; then
            echo 'Weapon assets already present: no changes needed.'
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add ten original textured 3D weapon GLB assets"
          git push origin HEAD:assets/weapon-glb-exports
